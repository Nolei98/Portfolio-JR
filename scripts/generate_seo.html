<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #BA5427;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #BA5427;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }
    .photo-container {
      position: absolute;
      right: -20px;
      top: -30px;
      width: 680px;
      height: 700px;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 15%;
      filter: drop-shadow(-20px 0 40px rgba(186, 84, 39, 0.8));
    }
    .content {
      position: relative;
      z-index: 10;
      padding-left: 90px;
      max-width: 580px;
      display: flex;
      flex-direction: column;
    }
    .name-white {
      font-family: 'Inter', sans-serif;
      font-size: 86px;
      font-weight: 800;
      line-height: 1.0;
      color: #FFFFFF;
      letter-spacing: -0.03em;
    }
    .name-dark {
      font-family: 'Inter', sans-serif;
      font-size: 86px;
      font-weight: 800;
      line-height: 1.05;
      color: #141210;
      letter-spacing: -0.03em;
      margin-bottom: 38px;
    }
    .tags {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tag-line {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    .tag-sub {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="content">
      <h1 class="name-white">Igôr</h1>
      <h1 class="name-dark">Nunes</h1>
      <div class="tags">
        <div class="tag-line">Full Stack Developer</div>
        <div class="tag-sub">Java · C# · IA</div>
      </div>
    </div>
    <div class="photo-container">
      <img src="../public/joao-blend.webp" alt="Igôr Nunes">
    </div>
  </div>
</body>
</html>
